name: release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Package release bundle
        run: |
          mkdir -p release-artifact
          cp package.json release-artifact/
          cp README.md release-artifact/
          cp -R docs release-artifact/docs
          cp -R lib release-artifact/lib
          cp -R prisma release-artifact/prisma
          cp -R scripts release-artifact/scripts

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-ops-release-bundle
          path: release-artifact
